provenance:
  manuscript: Final ESWA-D-26-05581R1 revised manuscript (not distributed)
  submission: ESWA-D-26-05581R1
  geometry: XY disk source and target reconstructed from figure markings; these are
    not slices through the previous 3D spheres
  coefficients: unreported source strengths and wind constants are explicit assumptions
  numerical_enhancement: graph initialization and one-sided short-step Bellman inequality
    for branch selection; not stated in manuscript
  source_strength: user-requested higher demand; all 2D source rates are 3 times the
    accepted low-load cases
  dimensionality: explicit XY reduction, unit-depth layer at z=5; manuscript reports
    2D obstacle/wind diagnostics and main figures marked z=5
  density_upper_bound: 0.25 replaces the reconstruction-specific 0.05 projection bound;
    rho_jam, speed closure, wind and geometry remain unchanged
  grid: 100x100 XY reduction, not the manuscript's 100x100x50 3D main grid
  manuscript_sha256: 95f1441f2b34eb497258f98c794c4d7e134f4f4556300fae42ad872c2fbf6ccc
