[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-mfg-eswa"
version = "0.1.0"
description = "Independent implementation of the ESWA revised hybrid PINN-FVM manuscript"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.7", "numpy>=2", "scipy>=1.14", "matplotlib>=3.9", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uav-mfg = "uav_mfg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uav_mfg = ["*.cpp"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
