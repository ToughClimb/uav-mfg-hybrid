extends: reconstruction.yaml
provenance:
  numerical_enhancement: graph initialization and one-sided short-step Bellman inequality for branch selection; not stated in manuscript
  source_strength: reconstruction choice reduced to avoid density projection in the verification runs
source: {rate: 0.001}
homing_rate: 0.00001
cpu_threads: 8
coupling:
  continuity_tolerance: 0.001 # additional accepted-field stationarity check
transport:
  backend: cuda
  graph_steps: 100
training:
  initial_epochs: 1800
  subsequent_epochs: 30
  causality_weight: 1.0
  causality_step: 2.5
  causality_points: 256
  initialization: graph_pretrain
  pretrain_epochs: 1800
  value_mean_tolerance: 0.02
  value_p95_tolerance: 0.12
